  radial-gradient(52% 64% at 74% 46%,rgba(205,171,104,.075),transparent 72%),

const Y0 = 1680, Y1 = 1900;
const yAn = an => G.top + (an - Y0) / (Y1 - Y0) * G.mainH;

function mesurer(){
  const r = harpe.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  G.petit = W < 560;
  const regle = G.petit ? 50 : 68;
  G.droite = G.petit ? 8 : 34;
  G.top = G.petit ? 66 : Math.max(86, H * .105);
  const zoneV = G.petit ? Math.max(76, H * .14) : Math.max(96, H * .14);
  G.mainH = Math.max(120, H - G.top - zoneV);
  G.y1900 = yAn(1900);
  G.rx = regle - 14;
  G.s = (W - regle - G.droite) / 6;
  G.u = clamp(G.s / 13, 4.2, 8.6);
  const fs = G.petit ? 10 : 12.5;
  G.cordes = COMPOS.map(c => {
    const yT = yAn(c.n);
    return { c, i:c.i, x: regle + G.s * (c.i + .5), yT, yB: yAn(c.m), yNom: yT - (G.petit ? 8 : 11) - c.nom.length * (fs * .82 + (G.petit ? 1.6 : 2.7)) };
  });
  G.yV = H - zoneV * .4;
  G.xV = G.cordes[1].x + G.s * .55;
  G.fils = FILS.map(geomFil);
  G.parId = Object.fromEntries(G.fils.map(g => [g.f.id, g]));
}

function geomFil(f){
  const A = G.cordes[PAR_ID[f.de].i];
  let x1, y1, y0;
  if (f.a === 'voyager'){ x1 = G.xV; y1 = G.yV; y0 = A.yB; }
  else {
    const B = G.cordes[PAR_ID[f.a].i];
    x1 = B.x; y1 = f.an === 'fin' ? B.yB : yAn(f.an);
    y0 = f.apres ? A.yB : y1;
  }
  const x0 = A.x;
  const L = Math.hypot(x1 - x0, y1 - y0);
  const horizontal = !f.apres && f.a !== 'voyager';
  const k = f.sag != null ? f.sag : (horizontal ? .03 : .06);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + L * k;
  const pts = [];
  for (let j = 0; j <= 32; j++){ const t = j / 32, m = 1 - t; pts.push([m * m * x0 + 2 * m * t * cx + t * t * x1, m * m * y0 + 2 * m * t * cy + t * t * y1]); }
  return { f, x0, y0, x1, y1, cx, cy, L, pts, mx: pts[16][0], my: pts[16][1] };
}

    const mouille = c.createGain(); mouille.gain.value = .3;
    this.verb.connect(mouille); mouille.connect(this.maitre);
    this.tampons = COMPOS.map(cp => this.corde(sr, cp.f, 4.2));
    return true;
  },
  impulsion(sr, dur){
    const n = Math.floor(sr * dur), b = this.ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++){
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++){ lp += .35 * ((Math.random() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - i / n, 2.4) * Math.exp(-i / sr * 1.5); }
    }
    return b;
  },
  corde(sr, f, dur){
    const n = Math.floor(sr * dur), b = this.ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    const N = Math.max(2, Math.round(sr / f - .5));
    let lp = 0;
    for (let i = 0; i < N && i < n; i++){ lp += .5 * ((Math.random() * 2 - 1) - lp); d[i] = lp; }
    let moy = 0; for (let i = 0; i < N; i++) moy += d[i]; moy /= N; for (let i = 0; i < N; i++) d[i] -= moy;
    const rho = f < 200 ? .9978 : f < 340 ? .997 : .9962;
    for (let i = N; i < n; i++){ d[i] = rho * .5 * (d[i - N] + (i - N - 1 >= 0 ? d[i - N - 1] : 0)); }
    let pk = 0; for (let i = 0; i < n; i++){ const a = Math.abs(d[i]); if (a > pk) pk = a; }
    const g = .9 / (pk || 1), fo = Math.floor(sr * .3);
    for (let i = 0; i < n; i++) d[i] *= g;
    for (let i = 0; i < fo; i++) d[n - 1 - i] *= i / fo;
    return b;
  },
  jouer(i, force, an, symp, octave){
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    if (symp && this.voix > 18) return;
    const c = this.ctx, t = c.currentTime + .005;
    const src = c.createBufferSource(); src.buffer = this.tampons[i];
    src.playbackRate.value = (octave ? 2 : 1) * (1 + (Math.random() - .5) * .002);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .4;
    let coupe = symp ? 1700 : 2400 + force * 950;
    let gain = symp ? .045 + .08 * Math.min(force, 1.6) : .16 + .045 * Math.min(force, 6);
    if (COMPOS[i].id === 'beethoven' && an){
      const s = lisse(1796, 1827, an);
      coupe = coupe * (1 - s) + 230 * s;
      gain *= 1 - .8 * s;
    }
    lp.frequency.value = Math.min(12000, coupe);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + (symp ? .07 : .004));
    src.connect(lp); lp.connect(g);
    let sortieNoeud = g;
    if (c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = (i - 2.5) / 2.5 * .55; g.connect(p); sortieNoeud = p; }
    sortieNoeud.connect(this.maitre); sortieNoeud.connect(this.verb);
    this.voix++;
    src.onended = () => { this.voix = Math.max(0, this.voix - 1); };
    src.start(t); src.stop(t + 4.2);
  }
};

btnSon.addEventListener('click', async () => {
  if (!Son.ctx && !Son.init()){
    btnSon.querySelector('.lib').textContent = 'Son indisponible';
    btnSon.disabled = true; return;
  }
  try { if (Son.ctx.state !== 'running') await Son.ctx.resume(); } catch (e) {}
  Son.on = !Son.on;
  btnSon.setAttribute('aria-pressed', String(Son.on));
  btnSon.querySelector('.lib').textContent = Son.on ? 'Son activé' : 'Son coupé';
  if (Son.on) COMPOS.forEach((c, i) => setTimeout(() => pincer(c.id, null, 2.4), 85 * i));
});

/* =====================================================================
   Pincer, résonner, voyager le long des fils
   ===================================================================== */
function yEmb(c){ return yAn(c.anEmb); }

function pincer(id, y, force, o = {}){
  const c = PAR_ID[id], k = G.cordes[c.i], v = vib[c.i];
  if (y == null) y = (k.yT + k.yB) / 2;
  const amax = G.petit ? 7 : 11;
  v.a = Math.min(amax, v.a * .5 + force * (G.petit ? 1.25 : 1.85));
  v.yp = clamp(y, k.yT + 2, k.yB - 2);
  v.t0 = now();
  if (!o.symp) anim[id] = now();
  if (o.son !== false) Son.jouer(c.i, force, anY(y), !!o.symp, false);
}

function lancerPulse(g, sens, fin, discret){
  if (reduit){ fin && fin(); return; }
  pulses.push({ g, t0: now(), dur: clamp(g.L / (discret ? 150 : 330), .45, 2.4), sens, fin, discret: !!discret });
}

function resonner(id, exclu){
  const lies = G.fils.filter(g => (g.f.de === id || g.f.a === id) && g.f.id !== exclu);
  lies.sort((a, b) => cleAn(a.f) - cleAn(b.f));
  const dejaSon = new Set();
  lies.forEach((g, n) => {
    const sens = g.f.de === id ? 1 : -1;
    const autre = sens > 0 ? g.f.a : g.f.de;
    setTimeout(() => {
      lancerPulse(g, sens, () => {
        if (autre === 'voyager') return;
        const y = sens > 0 ? g.y1 : g.y0;
        const son = !dejaSon.has(autre); dejaSon.add(autre);
        pincer(autre, y, .5 + 1.1 * POIDS[g.f.niv], { symp:true, son });
      });
    }, (reduit ? 40 : 110) + n * (reduit ? 25 : 65));
  });
}

/* =====================================================================
   Dessin
   ===================================================================== */
function trait(x0, y0, x1, y1){ ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
function etiquette(g, taille, poids){
  g.font = `${poids || 500} ${taille}px ${F_ETIQ}`;
  if ('fontStretch' in g) g.fontStretch = 'expanded';
}

function dessiner(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const ouv = reduit ? 99 : t - tOuv;
  const aRegle = clamp(ouv / .6, 0, 1);
  const aFils = clamp((ouv - .85) / .9, 0, 1);
  const aEmb = clamp((ouv - 1.15) / .7, 0, 1);
  dessinerRegle(aRegle);
  dessinerFils(aFils);
  dessinerCordes(t, ouv);
  dessinerEmblemes(t, aEmb);
  dessinerNoms(aRegle);
  dessinerVoyager(t, aFils);
  dessinerPulses(t);
  dessinerLigneAn();
}

function dessinerRegle(a){
  if (a <= 0) return;
  const x = G.rx;
  ctx.save(); ctx.globalAlpha = a;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(236,227,208,.2)';
  trait(x, yAn(1680), x, G.y1900);
  for (let an = 1680; an <= 1900; an += 10){ const y = yAn(an); trait(x - (an % 50 === 0 ? 6 : 3), y, x, y); }
  etiquette(ctx, G.petit ? 9 : 10);
  ctx.fillStyle = 'rgba(236,227,208,.46)'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const an of [1700, 1750, 1800, 1850, 1900]) ctx.fillText(String(an), x - 9, yAn(an));
  ctx.strokeStyle = 'rgba(236,227,208,.045)';
  for (const an of [1700, 1800, 1900]) trait(x + 5, yAn(an), W - G.droite * .4, yAn(an));
  /* le silence : 1750-1756 */
  const ys0 = yAn(1750.57), ys1 = yAn(1756.07);
  ctx.strokeStyle = 'rgba(205,171,104,.6)'; ctx.lineWidth = 1.5; trait(x + 3, ys0, x + 3, ys1);
  if (document.fonts && document.fonts.check(`13px ${F_MUS}`, '\u{1D13D}')){
    ctx.font = `${G.petit ? 11 : 13}px ${F_MUS}`; ctx.fillStyle = 'rgba(205,171,104,.7)'; ctx.textAlign = 'left';
    ctx.fillText('\u{1D13D}', x + 8, (ys0 + ys1) / 2);
  }
  /* césure, puis 1977 */
  const yc = G.y1900 + (G.yV - G.y1900) * .45;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(236,227,208,.22)'; ctx.setLineDash([1.5, 3.5]);
  trait(x, G.y1900 + 4, x, yc - 8); trait(x, yc + 8, x, G.yV - 6); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(236,227,208,.55)'; trait(x - 5, yc + 5, x - 1, yc - 5); trait(x + 1, yc + 5, x + 5, yc - 5);
  etiquette(ctx, G.petit ? 9 : 10); ctx.fillStyle = 'rgba(236,227,208,.46)'; ctx.textAlign = 'right';
  ctx.fillText('1977', x - 9, G.yV);
  ctx.restore();
}

function memeHistoire(f, id){ const o = PAR_FIL[id]; return f.id === id || (f.hist && o && f.hist === o.hist); }

function etatFil(g){
  const f = g.f;
  const d2 = (g.mx - lum.x) ** 2 + (g.my - lum.y) ** 2;
  let a = (f.niv === 'leg' ? .12 : .16) + .2 * Math.exp(-d2 / (lum.r * lum.r));
  let w = 1, vif = false;
  if (sel){
    let lie = false;
    if (sel.type === 'compo') lie = f.de === sel.id || f.a === sel.id;
    else if (sel.type === 'fil') lie = memeHistoire(f, sel.id);
    else lie = f.a === 'voyager';
    if (lie){ a = f.niv === 'leg' ? .52 : .74; w = 1.15; vif = true; } else a *= .38;
  }
  if (survolCompoNotice && (f.de === survolCompoNotice || f.a === survolCompoNotice)){ a = Math.max(a, .55); vif = true; }
  if ((survol && survol.type === 'fil' && memeHistoire(f, survol.id)) || (survolNotice && survolNotice.has(f.id))){ a = 1; w = 1.7; vif = true; }
  return { a, w, vif };
}

function zigzag(g){
  const p = g.pts; ctx.moveTo(p[0][0], p[0][1]);
  for (let j = 1; j < p.length; j++){
    const [x, y] = p[j], [px, py] = p[j - 1];
    const dx = x - px, dy = y - py, l = Math.hypot(dx, dy) || 1;
    const o = j === p.length - 1 ? 0 : (j % 2 ? 1.8 : -1.8);
    ctx.lineTo(x - dy / l * o, y + dx / l * o);
  }
}

function dessinerFils(aG){
  if (aG <= 0) return;
  ctx.save(); ctx.lineCap = 'round';
  for (const g of G.fils){
    const e = etatFil(g), f = g.f;
    const a = e.a * aG; if (a < .01) continue;
    ctx.strokeStyle = e.vif ? `rgba(241,219,163,${a})` : `rgba(205,171,104,${a})`;
    ctx.lineWidth = e.w;
    if (f.niv === 'tem'){ ctx.setLineDash([.1, 3.6]); ctx.lineWidth = e.w + .7; }
    else if (f.niv === 'leg') ctx.setLineDash([6, 5]);
    else ctx.setLineDash([]);
    ctx.beginPath();
    if (f.querelle) zigzag(g);
    else { ctx.moveTo(g.x0, g.y0); ctx.quadraticCurveTo(g.cx, g.cy, g.x1, g.y1); }
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();
}

function forme(k, v, y, t){
  const L = k.yB - k.yT; if (L <= 0) return 0;
  const u = (y - k.yT) / L;
  const up = clamp((v.yp - k.yT) / L, .06, .94);
  const tri = u < up ? u / up : (1 - u) / (1 - up);
  const m = 1 - Math.exp(-(t - v.t0) / .2);
  let s = tri * (1 - m) + Math.sin(Math.PI * u) * m;
  if (k.c.id === 'beethoven') s *= 1 - .72 * lisse(1798, 1827, anY(y));
  return s;
}

function tracer(k, yFin, dep){
  const N = 44, L = yFin - k.yT;
  ctx.beginPath();
  for (let j = 0; j <= N; j++){ const y = k.yT + L * j / N; const dx = dep(y); if (j) ctx.lineTo(k.x + dx, y); else ctx.moveTo(k.x + dx, y); }
}

function dessinerCordes(t, ouv){
  const lw = G.petit ? 1.05 : 1.25;
  for (const k of G.cordes){
    const c = k.c, v = vib[k.i];
    const p = reduit ? 1 : sortie(clamp((ouv - .15 - k.i * .13) / .7, 0, 1));
    const choisi = sel && sel.type === 'compo' && sel.id === c.id;
    const touche = (survol && survol.type === 'compo' && survol.id === c.id) || survolCompoNotice === c.id;
    const vivant = anneeSurvol != null && anneeSurvol >= c.n && anneeSurvol <= c.m;
    const lieFil = sel && sel.type === 'fil' && (PAR_FIL[sel.id].de === c.id || PAR_FIL[sel.id].a === c.id || (PAR_FIL[sel.id].hist && FILS.some(f => f.hist === PAR_FIL[sel.id].hist && (f.de === c.id || f.a === c.id))));
    const terne = sel && sel.type === 'compo' && !choisi;
    const L = k.yB - k.yT, yFin = k.yT + L * p;

    if (choisi || touche || lieFil){
      ctx.save(); ctx.lineCap = 'round';
      ctx.strokeStyle = rgba(c.acc, choisi ? .1 : .055); ctx.lineWidth = choisi ? 10 : 7;
      trait(k.x, k.yT, k.x, k.yB);
      ctx.restore();
    }
    if (p < 1){ ctx.strokeStyle = 'rgba(205,171,104,.17)'; ctx.lineWidth = 1; trait(k.x, k.yT, k.x, k.yB); }

    /* couleur : or ; chez Beethoven, l’or s’assourdit en graphite */
    const base = choisi || lieFil ? [241, 219, 163] : [205, 171, 104];
    const al = choisi ? 1 : touche || vivant || lieFil ? .95 : terne ? .55 : .8;
    let style;
    if (c.id === 'beethoven'){
      const gr = ctx.createLinearGradient(0, k.yT, 0, k.yB);
      const f1 = clamp((yAn(1798) - k.yT) / L, 0, 1), f2 = clamp((yAn(1816) - k.yT) / L, 0, 1);
      gr.addColorStop(0, `rgba(${base},${al})`); gr.addColorStop(f1, `rgba(${base},${al})`);
      gr.addColorStop(f2, `rgba(160,140,104,${al * .85})`); gr.addColorStop(1, `rgba(108,106,100,${al * .8})`);
      style = gr;
    } else style = `rgba(${base},${al})`;

    const vibre = v.a > .05;
    const ph = v.ph;
    const dep = vibre ? (y => v.a * forme(k, v, y, t) * Math.cos(ph)) : (() => 0);

    if (vibre){
      /* fuseau de vibration */
      const N = 30;
      ctx.beginPath();
      for (let j = 0; j <= N; j++){ const y = k.yT + L * j / N; const d = v.a * forme(k, v, y, t); if (j) ctx.lineTo(k.x + d, y); else ctx.moveTo(k.x + d, y); }
      for (let j = N; j >= 0; j--){ const y = k.yT + L * j / N; ctx.lineTo(k.x - v.a * forme(k, v, y, t), y); }
      ctx.fillStyle = rgba(c.acc, .075 * clamp(v.a / 5, 0, 1)); ctx.fill();
      ctx.strokeStyle = 'rgba(241,219,163,.22)'; ctx.lineWidth = lw * .8;
      tracer(k, yFin, y => -dep(y)); ctx.stroke();
    }

    ctx.lineCap = 'round';
    if (c.id === 'brahms' && vibre && v.a > .4){
      /* le rastral : la corde se dédouble en cinq lignes */
      const ecart = (G.petit ? 2.2 : 3) * clamp(v.a / 5, 0, 1);
      for (let j = -2; j <= 2; j++){
        ctx.strokeStyle = style; ctx.lineWidth = lw * (j ? .75 : 1);
        tracer(k, yFin, y => dep(y) + j * ecart * Math.sin(Math.PI * clamp((y - k.yT) / L, 0, 1))); ctx.stroke();
      }
    } else {
      ctx.strokeStyle = style; ctx.lineWidth = lw + (choisi ? .5 : 0);
      tracer(k, yFin, dep); ctx.stroke();
    }

    /* reflet de la lumière qui passe */
    const dxl = Math.abs(k.x - lum.x);
    const chute = Math.exp(-(dxl * dxl) / (lum.r * lum.r * .3));
    if (chute > .03 && p > .2){
      const gr2 = ctx.createLinearGradient(0, lum.y - lum.r * .75, 0, lum.y + lum.r * .75);
      gr2.addColorStop(0, 'rgba(255,240,205,0)'); gr2.addColorStop(.5, `rgba(255,242,210,${.6 * chute})`); gr2.addColorStop(1, 'rgba(255,240,205,0)');
      ctx.strokeStyle = gr2; ctx.lineWidth = lw;
      tracer(k, yFin, dep); ctx.stroke();
    }

    /* chevilles */
    ctx.beginPath(); ctx.arc(k.x, k.yT, G.petit ? 2.4 : 3, 0, 7);
    ctx.fillStyle = '#0c0a08'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = choisi ? rgba(c.acc, 1) : 'rgba(236,227,208,.75)'; ctx.stroke();
    if (p > .98){
      ctx.beginPath(); ctx.arc(k.x, k.yB, G.petit ? 2 : 2.5, 0, 7);
      ctx.fillStyle = choisi ? '#f1dba3' : 'rgba(205,171,104,.9)'; ctx.fill();
    }
    if (choisi || touche){
      etiquette(ctx, G.petit ? 8.5 : 9.5); ctx.fillStyle = 'rgba(241,219,163,.85)'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.floor(c.n)), k.x - 7, k.yT);
      ctx.fillText(String(Math.floor(c.m)), k.x - 7, k.yB);
    }
  }
}

/* ---------- emblèmes : un par page ---------- */
function lune(g, x, y, u, dt, fort){
  const r = u * .95;
  const pul = dt < 2.4 ? Math.sin(clamp(dt / 2.4, 0, 1) * Math.PI) : 0;
  const halo = .13 + .3 * pul + (fort ? .1 : 0);
  let gr = g.createRadialGradient(x, y, r * .5, x, y, r * 4.4);
  gr.addColorStop(0, `rgba(207,220,234,${halo})`); gr.addColorStop(1, 'rgba(207,220,234,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4.4, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip();
  gr = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
  gr.addColorStop(0, '#f6f9fc'); gr.addColorStop(.7, '#cfdcea'); gr.addColorStop(1, '#8fa3ba');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  g.fillStyle = 'rgba(143,163,186,.38)';
  g.beginPath(); g.arc(x - r * .3, y + r * .25, r * .22, 0, 7); g.fill();
  g.beginPath(); g.arc(x - r * .05, y - r * .38, r * .14, 0, 7); g.fill();
  g.fillStyle = 'rgba(12,10,8,.8)'; g.beginPath(); g.arc(x + r * .66, y - r * .16, r * .96, 0, 7); g.fill();
  g.restore();
}

function corpsEtourneau(g, bx, by, u){
  const gr = g.createLinearGradient(bx - u * 1.4, by + u * .5, bx + u, by - u * .7);
  gr.addColorStop(0, '#7d5fc4'); gr.addColorStop(.55, '#3f9c88'); gr.addColorStop(1, '#b4884a');
  g.fillStyle = gr;
  g.beginPath(); /* queue */
  g.moveTo(bx - u * .6, by + u * .15); g.lineTo(bx - u * 1.4, by + u * .62); g.lineTo(bx - u * 1.18, by + u * .84); g.lineTo(bx - u * .45, by + u * .44); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(bx, by, u * .84, u * .5, -.38, 0, 7); g.fill();
  g.beginPath(); g.arc(bx + u * .62, by - u * .52, u * .35, 0, 7); g.fill();
  g.fillStyle = '#e0bd62'; /* bec jaune */
  g.beginPath(); g.moveTo(bx + u * .9, by - u * .62); g.lineTo(bx + u * 1.42, by - u * .5); g.lineTo(bx + u * .92, by - u * .42); g.closePath(); g.fill();
  g.fillStyle = 'rgba(236,227,208,.85)'; /* mouchetures */
  for (const [px, py] of [[-.35, -.05], [-.05, .12], [.2, -.18], [-.5, .2], [.12, .25]]){ g.beginPath(); g.arc(bx + u * px, by + u * py, u * .055, 0, 7); g.fill(); }
  g.fillStyle = '#0c0a08'; g.beginPath(); g.arc(bx + u * .72, by - u * .6, u * .07, 0, 7); g.fill();
}

function etourneau(g, kx, y, u, dt){
  const bx0 = kx - u * 1.32, by0 = y;
  const vol = dt >= 0 && dt < 1.7;
  if (!vol){
    corpsEtourneau(g, bx0, by0, u);
    g.strokeStyle = 'rgba(205,171,104,.75)'; g.lineWidth = .8;
    g.beginPath(); g.moveTo(bx0 + u * .05, by0 + u * .42); g.lineTo(kx, y + u * .6); g.moveTo(bx0 + u * .3, by0 + u * .36); g.lineTo(kx, y + u * .42); g.stroke();
    return;
  }
  const s = dt / 1.7, R = u * 3.3;
  const px = bx0 - R * 1.5 * Math.sin(Math.PI * s), py = by0 - R * .9 * Math.sin(2 * Math.PI * s) - R * .35 * Math.sin(Math.PI * s);
  const ds = .01, qx = bx0 - R * 1.5 * Math.sin(Math.PI * (s + ds)), qy = by0 - R * .9 * Math.sin(2 * Math.PI * (s + ds)) - R * .35 * Math.sin(Math.PI * (s + ds));
  const ang = Math.atan2(qy - py, qx - px);
  const bat = Math.sin(dt * 34) * .9;
  g.save(); g.translate(px, py); g.rotate(ang);
  g.fillStyle = '#5d6fb0';
  g.beginPath(); g.ellipse(0, 0, u * .7, u * .32, 0, 0, 7); g.fill();
  g.strokeStyle = '#8a74cf'; g.lineWidth = u * .22; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-u * .1, 0); g.quadraticCurveTo(-u * .5, -u * (1.1 * bat), -u * .9, -u * (1.25 * bat)); g.stroke();
  g.beginPath(); g.moveTo(-u * .1, 0); g.quadraticCurveTo(-u * .5, u * (1.1 * bat), -u * .9, u * (1.25 * bat)); g.stroke();
  g.fillStyle = '#e0bd62'; g.beginPath(); g.moveTo(u * .66, -u * .08); g.lineTo(u * 1.05, 0); g.lineTo(u * .66, u * .08); g.fill();
  g.restore();
}

function cochlee(g, cx, cy, u, dt){
  const tours = 2.75, T = tours * Math.PI * 2, rM = u * 1.18;
  g.fillStyle = 'rgba(12,10,8,.85)'; g.beginPath(); g.arc(cx, cy, rM * 1.08, 0, 7); g.fill();
  g.strokeStyle = 'rgba(240,220,170,.92)'; g.lineWidth = .9;
  g.beginPath();
  for (let j = 0; j <= 120; j++){ const th = T * j / 120; const r = rM * Math.pow(.12, th / T); const x = cx + r * Math.cos(th + .6), y = cy + r * Math.sin(th + .6); if (j) g.lineTo(x, y); else g.moveTo(x, y); }
  g.stroke();
  g.strokeStyle = 'rgba(240,220,170,.4)'; g.lineWidth = .6;
  for (let j = 0; j < 9; j++){ const th = j * .62; const r = rM * Math.pow(.12, th / T); const r2 = r * .8; g.beginPath(); g.moveTo(cx + r * Math.cos(th + .6), cy + r * Math.sin(th + .6)); g.lineTo(cx + r2 * Math.cos(th + .6), cy + r2 * Math.sin(th + .6)); g.stroke(); }
  if (dt >= 0 && dt < 1.6){
    const th = T * sortie(dt / 1.6); const r = rM * Math.pow(.12, th / T);
    const x = cx + r * Math.cos(th + .6), y = cy + r * Math.sin(th + .6);
    const gr = g.createRadialGradient(x, y, 0, x, y, u * .9); gr.addColorStop(0, 'rgba(255,244,214,.95)'); gr.addColorStop(1, 'rgba(255,244,214,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, u * .9, 0, 7); g.fill();
  }
}

function fioritures(g, x, y, u, dt){
  const pts = [];
  for (let j = 0; j < 7; j++){ const s = j / 6; pts.push([x - u * 2.5 + u * 2.15 * s, y + u * 1 - u * 2 * s - Math.sin(s * Math.PI) * u * .35]); }
  g.strokeStyle = 'rgba(195,203,210,.5)'; g.lineWidth = .7;
  g.beginPath(); g.moveTo(pts[0][0] - u * .2, pts[0][1] - u * .55); g.quadraticCurveTo(x - u * 1.7, y - u * 1.9, pts[6][0] + u * .1, pts[6][1] - u * .6); g.stroke();
  pts.forEach(([px, py], j) => {
    const on = dt >= 0 && dt - j * .085 >= 0 && dt - j * .085 < .42;
    if (on){ const gr = g.createRadialGradient(px, py, 0, px, py, u * .9); gr.addColorStop(0, 'rgba(235,242,248,.85)'); gr.addColorStop(1, 'rgba(235,242,248,0)'); g.fillStyle = gr; g.beginPath(); g.arc(px, py, u * .9, 0, 7); g.fill(); }
    g.fillStyle = on ? '#f4f7fa' : 'rgba(195,203,210,.9)';
    g.beginPath(); g.ellipse(px, py, u * .3, u * .2, -.45, 0, 7); g.fill();
  });
}

function comete(g, kx, y, yBas, u, dt){
  let yh = y, a = 1, a2 = 0;
  if (dt >= 0 && dt < 1.7){ const s = dt / 1.7; yh = y + (yBas - y) * (s < .5 ? 2 * s * s : 1 - Math.pow(-2 * s + 2, 2) / 2); a = 1 - lisse(.82, 1, s); }
  else if (dt >= 1.7 && dt < 2.4){ a = 0; a2 = (dt - 1.7) / .7; }
  const dessinTete = (yy, al) => {
    if (al <= 0) return;
    /* la queue part vers le haut et la droite, et laisse le nom au-dessus de la cheville */
    const queue = u * 5.6, ax = Math.sin(.62), ay = Math.cos(.62);
    const qx = kx + ax * queue, qy = yy - ay * queue;
    let gr = g.createLinearGradient(qx, qy, kx, yy);
    gr.addColorStop(0, 'rgba(239,123,89,0)'); gr.addColorStop(1, `rgba(239,123,89,${.55 * al})`);
    g.fillStyle = gr; g.beginPath();
    g.moveTo(kx - ay * u * .36, yy - ax * u * .36); g.lineTo(qx - ay * u * .06, qy - ax * u * .06);
    g.lineTo(qx + ay * u * .06, qy + ax * u * .06); g.lineTo(kx + ay * u * .36, yy + ax * u * .36); g.closePath(); g.fill();
    g.strokeStyle = `rgba(190,215,240,${.38 * al})`; g.lineWidth = .6;
    g.beginPath(); g.moveTo(kx + u * .15, yy - u * .1); g.lineTo(kx + Math.sin(.85) * queue * 1.12, yy - Math.cos(.85) * queue * 1.12); g.stroke();
    gr = g.createRadialGradient(kx, yy, 0, kx, yy, u * 1.9);
    gr.addColorStop(0, `rgba(255,246,230,${al})`); gr.addColorStop(.25, `rgba(255,196,150,${.75 * al})`); gr.addColorStop(1, 'rgba(239,123,89,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(kx, yy, u * 1.9, 0, 7); g.fill();
  };
  dessinTete(yh, a);
  if (a2 > 0) dessinTete(y, a2);
}

function rastral(g, x, y, u, dt){
  const ext = dt >= 0 && dt < 1.4 ? Math.sin(dt / 1.4 * Math.PI) : 0;
  const l = u * (1.45 + 1.6 * ext), e = u * .3;
  g.strokeStyle = 'rgba(235,225,201,.85)'; g.lineWidth = .8;
  for (let j = -2; j <= 2; j++){ const yy = y + j * e; g.beginPath(); g.moveTo(x - l, yy); g.lineTo(x + l, yy); g.stroke(); }
  g.fillStyle = 'rgba(235,225,201,.9)';
  for (let j = -2; j <= 2; j++){ g.beginPath(); g.arc(x - l, y + j * e, .9, 0, 7); g.fill(); }
}

function dessinerEmblemes(t, a){
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  for (const k of G.cordes){
    const c = k.c, y = yEmb(c), u = G.u, dt = t - anim[c.id];
    const fort = sel && sel.type === 'compo' && sel.id === c.id;
    if (c.id === 'bach') lune(ctx, k.x - .5, y, u, dt, fort);
    else if (c.id === 'mozart') etourneau(ctx, k.x, y, u, dt);
    else if (c.id === 'beethoven') cochlee(ctx, k.x - u * .55, y, u, dt);
    else if (c.id === 'chopin') fioritures(ctx, k.x, y, u, dt);
    else if (c.id === 'liszt') comete(ctx, k.x, y, k.yB, u, dt);
    else rastral(ctx, k.x, y, u, dt);
  }
  ctx.restore();
}

/* le nom prolonge la corde au-dessus de sa cheville, et se lit de bas en haut, comme au dos d’un livre */
function dessinerNoms(a){
  if (a <= 0) return;
  const fs = G.petit ? 10 : 12.5, ls = G.petit ? 1.6 : 2.7;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `600 ${fs}px ${F_TITRE}`;
  if ('fontStretch' in ctx) ctx.fontStretch = 'normal';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (const k of G.cordes){
    const c = k.c;
    const choisi = sel && sel.type === 'compo' && sel.id === c.id;
    const touche = (survol && survol.type === 'compo' && survol.id === c.id) || survolCompoNotice === c.id;
    const al = choisi || touche ? 1 : sel && sel.type === 'compo' ? .5 : .82;
    ctx.fillStyle = choisi ? c.acc : `rgba(236,227,208,${al})`;
    ctx.save(); ctx.translate(k.x + .5, k.yT - (G.petit ? 8 : 11)); ctx.rotate(-Math.PI / 2);
    let xx = 0;
    for (const ch of c.nom.toUpperCase()){ ctx.fillText(ch, xx, 0); xx += ctx.measureText(ch).width + ls; }
    ctx.restore();
  }
  ctx.restore();
}

function dessinerVoyager(t, a){
  if (a <= 0) return;
  const x = G.xV, y = G.yV, r = G.petit ? 4.3 : 5.4;
  const actif = (sel && sel.type === 'voyager') || (survol && survol.type === 'voyager');
  ctx.save(); ctx.globalAlpha = a;
  let gr = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
  gr.addColorStop(0, `rgba(241,219,163,${actif ? .34 : .16})`); gr.addColorStop(1, 'rgba(241,219,163,0)');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 7); ctx.fill();
  gr = ctx.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
  gr.addColorStop(0, '#f3dda0'); gr.addColorStop(1, '#a8833d');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(12,10,8,.4)'; ctx.lineWidth = .6;
  for (const q of [.8, .58, .38]){ ctx.beginPath(); ctx.arc(x, y, r * q, 0, 7); ctx.stroke(); }
  const ang = reduit ? 1 : t * .7;
  ctx.strokeStyle = 'rgba(255,248,226,.9)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r * .9, ang, ang + .9); ctx.stroke();
  ctx.fillStyle = '#0c0a08'; ctx.beginPath(); ctx.arc(x, y, r * .15, 0, 7); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `italic 400 ${G.petit ? 12.5 : 15}px ${F_TITRE}`;
  ctx.fillStyle = actif ? '#f1dba3' : 'rgba(236,227,208,.86)';
  ctx.fillText('Voyager 1', x + r + 9, y + (G.petit ? 1 : 2));
  etiquette(ctx, G.petit ? 8 : 9);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '1.4px';
  ctx.fillStyle = 'rgba(205,171,104,.78)';
  ctx.fillText(G.petit ? 'DISQUE D’OR · 1977' : 'LE DISQUE D’OR · 1977 → AUJOURD’HUI', x + r + 9, y + (G.petit ? 14 : 17));
  ctx.restore();
}

function dessinerPulses(t){
  for (let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    const s = (t - p.t0) / p.dur;
    if (s >= 1){ pulses.splice(i, 1); if (p.fin) p.fin(); continue; }
    if (s < 0) continue;
    const al = p.discret ? .5 : 1;
    for (let j = 1; j < 8; j++){
      const ss = s - j * .016; if (ss < 0) break;
      const [x, y] = surCourbe(p.g, p.sens > 0 ? ss : 1 - ss);
      ctx.fillStyle = `rgba(255,240,205,${al * (1 - j / 8) * .7})`;
      ctx.beginPath(); ctx.arc(x, y, (p.discret ? 1.1 : 1.7) * (1 - j / 10), 0, 7); ctx.fill();
    }
    const [x, y] = surCourbe(p.g, p.sens > 0 ? s : 1 - s);
    const R = p.discret ? 7 : 12;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, `rgba(255,244,214,${.85 * al})`); gr.addColorStop(.25, `rgba(241,219,163,${.35 * al})`); gr.addColorStop(1, 'rgba(241,219,163,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  }
}

function dessinerLigneAn(){
  if (anneeSurvol == null) return;
  const y = yAn(anneeSurvol);
  ctx.save();
  ctx.strokeStyle = 'rgba(236,227,208,.14)'; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
  trait(G.rx + 7, y, W - G.droite * .4, y); ctx.setLineDash([]);
  const txt = String(Math.floor(anneeSurvol));
  etiquette(ctx, 10);
  const w = ctx.measureText(txt).width + 12;
  ctx.fillStyle = 'rgba(12,10,8,.94)'; ctx.fillRect(G.rx - w - 2, y - 8, w, 16);
  ctx.strokeStyle = 'rgba(205,171,104,.5)'; ctx.strokeRect(G.rx - w - 1.5, y - 7.5, w - 1, 15);
  ctx.fillStyle = '#f1dba3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, G.rx - w / 2 - 2, y + .5);
  ctx.restore();
}

/* =====================================================================
   Animation
   ===================================================================== */
function majEtat(dt, t){
  for (const k of G.cordes){
    const v = vib[k.i];
    if (v.a < .02){ v.a = 0; continue; }
    const tau = k.c.id === 'chopin' ? 1.25 : k.c.id === 'beethoven' ? .8 : 1.05;
    v.a *= Math.exp(-dt / tau);
    let w = Math.PI * 2 * 9.5;
    if (k.c.id === 'chopin') w *= 1 + .55 * Math.sin((t - v.t0) * 2.3);   /* rubato */
    v.ph += w * dt;
  }
  /* la lumière : elle suit le pointeur, sinon elle dérive lentement */
  lum.r = Math.max(W, H) * .24;
  if (!lum.pointe){
    if (reduit){ lum.tx = W * .55; lum.ty = H * .42; }
    else { lum.tx = W * (.52 + .36 * Math.sin(t * .11)); lum.ty = G.top + G.mainH * (.5 + .44 * Math.sin(t * .073 + 1.3)); }
  }
  const k = 1 - Math.exp(-dt * (lum.pointe ? 9 : 1.2));
  lum.x += (lum.tx - lum.x) * k; lum.y += (lum.ty - lum.y) * k;
  /* de temps en temps, une résonance traverse un fil d’elle-même */
  if (!reduit && t > prochainFilAmbiant && t - tOuv > 3){
    prochainFilAmbiant = t + 5 + Math.random() * 4.5;
    const g = G.fils[Math.floor(Math.random() * G.fils.length)];
    lancerPulse(g, 1, () => {
      if (g.f.a === 'voyager') return;
      const c = PAR_ID[g.f.a], v = vib[c.i];
      v.a = Math.max(v.a, G.petit ? 1.2 : 1.8); v.yp = g.y1; v.t0 = now();
    }, true);
  }
}

let derniere = now(), dernierDessin = 0, rafId = 0;
function boucle(){
  const t = now(), dt = Math.min(.05, t - derniere); derniere = t;
  majEtat(dt, t);
  const calme = !pulses.length && vib.every(v => v.a < .05) && t - tOuv > 2.6 && !survol && anneeSurvol == null;
  if (!calme || t - dernierDessin > .033){ dessiner(t); dernierDessin = t; }
  rafId = requestAnimationFrame(boucle);
}

/* =====================================================================
   Pointeur, toucher, clavier
   ===================================================================== */
const ptr = { px:null, py:null, pt:0, bas:null };
function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

function cibleEn(x, y, tactile){
  if (Math.hypot(x - G.xV, y - G.yV) < (tactile ? 22 : 15)) return { type:'voyager', id:'voyager' };
  const tolC = tactile ? Math.min(G.s * .45, 24) : Math.min(G.s * .3, 13);
  let best = null, bd = 1e9;
  for (const k of G.cordes){
    if (y < k.yNom - 6 || y > k.yB + 12) continue;
    const d = Math.abs(x - k.x);
    if (d < tolC && d < bd){ bd = d; best = { type:'compo', id:k.c.id }; }
  }
  if (best) return best;
  const tolF = tactile ? 12 : 6;
  let bf = null, bfd = 1e9;
  for (const g of G.fils){
    for (let j = 1; j < g.pts.length; j++){
      const d = distSeg(x, y, g.pts[j - 1], g.pts[j]);
      if (d < tolF && d < bfd){ bfd = d; bf = { type:'fil', id:g.f.id }; }
    }
  }
  return bf;
}
function distSeg(x, y, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
  const t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / l2, 0, 1);
  return Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy);
}

function croisements(x0, y0, x1, y1, dt){
  if (x0 === x1) return;
  const vitesse = Math.abs(x1 - x0) / Math.max(.008, dt);
  for (const k of G.cordes){
    if ((x0 - k.x) * (x1 - k.x) < 0){
      const y = y0 + (y1 - y0) * (k.x - x0) / (x1 - x0);
      if (y >= k.yT - 2 && y <= k.yB + 2){ pincer(k.c.id, y, clamp(vitesse / 260, .8, 6)); premiereInteraction(); }
    }
  }
}

function majBulle(x, y){
  let html = '';
  if (survol && survol.type === 'compo'){
    const c = PAR_ID[survol.id];
    html = `<b>${c.nom} · ${Math.round(clamp(anY(y), c.n, c.m))}</b><i>${c.site}</i>`;
  } else if (survol && survol.type === 'fil'){
    const f = PAR_FIL[survol.id], h = histoire(f);
    const qui = f.hist ? [...new Set(FILS.filter(x => x.hist === f.hist).map(x => nomDe(x.de)))].join(', ') + ' → ' + nomDe(f.a) : nomDe(f.de) + ' → ' + nomDe(f.a);
    html = `<b>${labelAn(h)} · ${qui}</b>${fr(h.titre)}`;
  } else if (survol && survol.type === 'voyager'){
    html = '<b>1977 · Voyager 1</b>Bach, Mozart et Beethoven sur le disque d’or';
  } else if (anneeSurvol != null && anneeSurvol > 1750.57 && anneeSurvol < 1756.07){
    html = '<b>1750 – 1756 · silence</b>Bach est mort, Mozart n’est pas encore né.';
  }
  if (!html){ bulle.hidden = true; return; }
  bulle.innerHTML = html; bulle.hidden = false;
  const bw = bulle.offsetWidth, bh = bulle.offsetHeight;
  let bx = x + 16, by = y + 16;
  if (bx + bw > W - 4) bx = x - bw - 14;
  if (by + bh > H - 4) by = y - bh - 14;
  bulle.style.transform = `translate(${Math.round(Math.max(0, bx))}px,${Math.round(Math.max(0, by))}px)`;
}

function survolEn(x, y){
  const c = cibleEn(x, y, false);
  survol = c;
  cv.style.cursor = c ? 'pointer' : '';
  anneeSurvol = y >= yAn(1680) && y <= G.y1900 && x > G.rx - 4 ? clamp(anY(y), 1680, 1900) : null;
  majBulle(x, y);
}

cv.addEventListener('pointermove', e => {
  const [x, y] = pos(e), t = now();
  if (ptr.px != null) croisements(ptr.px, ptr.py, x, y, t - ptr.pt);
  ptr.px = x; ptr.py = y; ptr.pt = t;
  if (e.pointerType === 'mouse'){ survolEn(x, y); lum.tx = x; lum.ty = y; lum.pointe = true; }
  else { lum.tx = x; lum.ty = y; }
  if (ptr.bas && Math.hypot(x - ptr.bas.x, y - ptr.bas.y) > 10) ptr.bas.bouge = true;
});
cv.addEventListener('pointerdown', e => {
  const [x, y] = pos(e);
  ptr.bas = { x, y, t: now(), bouge:false };
  ptr.px = x; ptr.py = y; ptr.pt = now();
  if (e.pointerType !== 'mouse'){ lum.tx = x; lum.ty = y; lum.pointe = true; }
});
cv.addEventListener('pointerup', e => {
  const b = ptr.bas; ptr.bas = null;
  const [x, y] = pos(e);
  if (b && !b.bouge && now() - b.t < .6) toucher(x, y, e.pointerType !== 'mouse');
  if (e.pointerType !== 'mouse'){ ptr.px = null; lum.pointe = false; }
});
cv.addEventListener('pointerleave', () => {
  ptr.px = null; survol = null; anneeSurvol = null; lum.pointe = false;
  bulle.hidden = true; cv.style.cursor = '';
});
cv.addEventListener('pointercancel', () => { ptr.bas = null; ptr.px = null; lum.pointe = false; });

function toucher(x, y, tactile){
  const c = cibleEn(x, y, tactile);
  if (!c) return;
  premiereInteraction();
  if (c.type === 'compo') choisir('compo', c.id, { depuis:'harpe', y });
  else if (c.type === 'fil') choisir('fil', c.id, { depuis:'harpe' });
  else choisir('voyager', 'voyager', { depuis:'harpe' });
}

harpe.addEventListener('keydown', e => {
  if (e.target !== harpe) return;
  const i = sel && sel.type === 'compo' ? PAR_ID[sel.id].i : -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); choisir('compo', COMPOS[(i + 1) % 6].id, { depuis:'clavier' }); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); choisir('compo', COMPOS[i < 0 ? 5 : (i + 5) % 6].id, { depuis:'clavier' }); }
  else if (e.key === ' '){ e.preventDefault(); if (i >= 0) pincer(sel.id, null, 4); }
  else if (e.key === 'Enter'){ const a = notice.querySelector('.entrer'); if (a){ e.preventDefault(); a.focus(); } }
  else if (e.key === 'Escape'){ sel = null; rendreAccueil(); }
});

function premiereInteraction(){
  if (interagi) return;
  interagi = true;
  consigne.classList.add('efface');
  consigneTete.classList.add('efface');
}

/* =====================================================================
   Choisir : une corde, un fil, ou la sonde
   ===================================================================== */
function choisir(type, id, o = {}){
  const avant = sel;
  sel = { type, id };
  if (type === 'compo'){
    const c = PAR_ID[id];
    const g = o.via ? G.parId[o.via] : null;
    if (g && avant && avant.type === 'compo' && avant.id !== id){
      const sens = g.f.a === id ? 1 : -1;
      lancerPulse(g, sens, () => { pincer(id, sens > 0 ? g.y1 : g.y0, 4.2); resonner(id, g.f.id); });
    } else {
      pincer(id, o.y != null ? o.y : yEmb(c), 4.6);
      resonner(id);
    }
    rendreCompo(id, o);
    annonce.textContent = `${c.complet}, ${Math.floor(c.n)} – ${Math.floor(c.m)}. ${c.site}.`;
  } else if (type === 'fil'){
    const f = PAR_FIL[id];
    const groupe = f.hist ? G.fils.filter(g => g.f.hist === f.hist) : [G.parId[id]];
    groupe.forEach((g, n) => setTimeout(() => {
      pincer(g.f.de, g.y0, 2.6);
      lancerPulse(g, 1, () => { if (g.f.a !== 'voyager') pincer(g.f.a, g.y1, 3); });
    }, n * 140));
    rendreFil(id, o, avant);
    annonce.textContent = `${fr(histoire(f).titre)}, ${labelAn(histoire(f))}.`;
  } else {
    const groupe = G.fils.filter(g => g.f.a === 'voyager');
    groupe.forEach((g, n) => setTimeout(() => {
      pincer(g.f.de, g.y0, 2.2);
      lancerPulse(g, 1, () => Son.jouer(PAR_ID[g.f.de].i, 1, null, true, true));
    }, n * 160));
    rendreVoyager(o, avant);
    annonce.textContent = 'Voyager 1, le disque d’or.';
  }
}

/* =====================================================================
   La notice
   ===================================================================== */
function rendreAccueil(focus){
  survolNotice = null; survolCompoNotice = null;
  notice.innerHTML = `<div class="accueil">
    <p class="intro lettrine">${fr('Sur la viole d’amour, des cordes qu’on ne touche jamais se mettent à vibrer quand une autre résonne. On les appelle cordes sympathiques.')}</p>
    <p class="intro">${fr('Ici, chaque corde est une vie, tendue de la naissance à la mort. Pincez-en une. Celles qui l’ont connue, lue ou combattue vibrent avec elle, et chaque fil mène à une page.')}</p>
    <h2 class="rubrique" id="r-pages" tabindex="-1">Les six pages</h2>
    <ol class="table">${COMPOS.map(c => `
      <li style="--c:${c.acc}">
        <button class="ligne" type="button" data-c="${c.id}" data-table="1"><span class="nom">${c.nom}</span><span class="points" aria-hidden="true"></span><span class="t">${c.site}</span></button>
        <p class="resume">${fr(c.desc)} <a class="ouvrir" href="${lienPage(c.id)}">Ouvrir la page<span aria-hidden="true"> →</span></a></p>
      </li>`).join('')}
    </ol>
    <h2 class="rubrique">Lire les fils</h2>
    <p class="petit">${fr('Un fil horizontal relie deux vivants. Ceux qui partent du bas d’une corde prolongent une œuvre après la mort.')}</p>
    <ul class="legende">
      <li><span class="ech" aria-hidden="true"></span>Document d’époque</li>
      <li><span class="ech e-tem" aria-hidden="true"></span>Témoignage, souvenir</li>
      <li><span class="ech e-leg" aria-hidden="true"></span>Légende, ouï-dire</li>
      <li><span class="ech e-que" aria-hidden="true"></span>Querelle</li>
    </ul>
    <p class="petit">${fr('Entre 1750 et 1756, aucune corde ne vibre. Bach est mort, Mozart n’est pas encore né.')}</p>
    <p class="petit pied">${fr('Les fils reprennent les anecdotes des six pages et le degré de fiabilité qu’elles leur donnent. Quelques-uns viennent d’ailleurs')}${' '}: <a href="https://musikverein.at/en/archiv/mozarts-symphonie-nr-40/" target="_blank" rel="noopener">le manuscrit de Mozart chez Brahms</a>, <a href="https://omifacsimiles.com/brochures/bach_chopin_wtc.html" target="_blank" rel="noopener">le Clavier annoté par Chopin</a>, <a href="https://science.nasa.gov/?p=385807" target="_blank" rel="noopener">le disque d’or</a>.</p>
  </div>`;
  if (focus){ const h = document.getElementById('r-pages'); h && h.focus({ preventScroll:true }); }
}

function groupesDe(id){
  const map = new Map();
  for (const f of FILS){
    if (f.de !== id && f.a !== id) continue;
    const cle = f.hist || f.id;
    if (!map.has(cle)) map.set(cle, { cle, fils:[], autres:[] });
    const gr = map.get(cle);
    gr.fils.push(f);
    const autre = f.de === id ? f.a : f.de;
    if (!gr.autres.includes(autre)) gr.autres.push(autre);
  }
  return [...map.values()].sort((a, b) => cleAn(a.fils[0]) - cleAn(b.fils[0]));
}

function boutonVers(autre, via){
  if (autre === 'voyager') return `<button class="vers" type="button" data-v="1" style="--c:#c9a356">Voyager 1</button>`;
  return `<button class="vers" type="button" data-c="${autre}"${via ? ` data-via="${via}"` : ''} style="--c:${PAR_ID[autre].acc}">${PAR_ID[autre].nom}</button>`;
}

function piedFil(h){
  const src = h.src ? (h.srcUrl ? `<a class="src" href="${h.srcUrl}" target="_blank" rel="noopener">${fr(h.src)}</a>` : fr(h.src)) : '';
  const liens = h.liens.map(([cid, an]) => `<a href="${lienPage(cid, an)}">Lire chez ${PAR_ID[cid].nom}<span aria-hidden="true"> →</span></a>`).join('');
  return `<p class="fil-pied"><span class="source">${src}</span><span class="lire">${liens}</span></p>`;
}

function niveauHtml(h){
  const cls = h.querelle ? 'e-que' : h.niv === 'tem' ? 'e-tem' : h.niv === 'leg' ? 'e-leg' : '';
  return `<span class="niveau"><span class="ech ${cls}" aria-hidden="true"></span>${h.lab}</span>`;
}

function itemFil(gr){
  const h = histoire(gr.fils[0]);
  const boutons = gr.autres.map(autre => {
    const via = gr.fils.find(x => x.de === autre || x.a === autre);
    return boutonVers(autre, via ? via.id : null);
  }).join('');
  return `<li class="fil" data-fils="${gr.fils.map(x => x.id).join(' ')}">
    <div class="fil-tete"><span class="annee">${labelAn(h)}</span>${h.lieu ? `<span class="lieu">${h.lieu}</span>` : ''}${niveauHtml(h)}</div>
    <p class="fil-avec">avec ${boutons}</p>
    <p class="fil-nom">${fr(h.titre)}</p>
    <p class="fil-texte">${fr(h.txt)}</p>
    ${piedFil(h)}
  </li>`;
}

function rendreCompo(id, o = {}){
  const c = PAR_ID[id];
  const groupes = groupesDe(id);
  const prec = COMPOS[c.i - 1], suiv = COMPOS[c.i + 1];
  survolNotice = null; survolCompoNotice = null;
  notice.innerHTML = `<article class="fiche" style="--acc:${c.acc}">
    <button class="retour" type="button" data-action="accueil"><span aria-hidden="true">←</span> Les six pages</button>
    <p class="lieux">${c.lieux}</p>
    <h2 class="nom-complet" tabindex="-1">${c.complet}</h2>
    <p class="site-titre">${c.site}</p>
    <p class="site-desc">${fr(c.desc)}</p>
    <a class="entrer" href="${lienPage(id)}"><span>Entrer dans la page</span><span class="fleche" aria-hidden="true">→</span></a>
    <figure class="embleme"><canvas class="mini" data-e="${id}" width="112" height="112" aria-hidden="true"></canvas><figcaption>${fr(c.emb)}</figcaption></figure>
    <h3 class="rubrique">Cordes sympathiques <span class="compte">${groupes.length} fils</span></h3>
    <ol class="fils">${groupes.map(itemFil).join('')}</ol>
    <nav class="voisins" aria-label="Cordes voisines">
      ${prec ? `<button class="voisin ouvrir" type="button" data-c="${prec.id}"><span aria-hidden="true">← </span>${prec.nom}</button>` : '<span></span>'}
      ${suiv ? `<button class="voisin ouvrir" type="button" data-c="${suiv.id}">${suiv.nom}<span aria-hidden="true"> →</span></button>` : '<span></span>'}
    </nav>
  </article>`;
  peindreMini(notice.querySelector('canvas.mini'), id);
  apresRendu(o);
}

function rendreFil(id, o = {}, avant){
  const f = PAR_FIL[id], h = histoire(f);
  const membres = f.hist ? FILS.filter(x => x.hist === f.hist) : [f];
  const noms = [...new Set(membres.flatMap(x => [x.de, x.a]))];
  const retourCompo = avant && avant.type === 'compo' ? avant.id : null;
  survolNotice = null; survolCompoNotice = null;
  notice.innerHTML = `<article class="fiche">
    <button class="retour" type="button" data-action="${retourCompo ? 'compo:' + retourCompo : 'accueil'}"><span aria-hidden="true">←</span> ${retourCompo ? PAR_ID[retourCompo].nom : 'Les six pages'}</button>
    <p class="lieux">${labelAn(h)}${h.lieu ? ' · ' + h.lieu : ''}</p>
    <h2 class="nom-complet" tabindex="-1">${fr(h.titre)}</h2>
    <p class="paire">${noms.map(n => boutonVers(n, null)).join('<span class="sep" aria-hidden="true">·</span>')}</p>
    <p class="fil-texte grand">${fr(h.txt)}</p>
    <div class="fil-tete" style="margin-top:1rem">${niveauHtml(h)}</div>
    ${piedFil(h)}
  </article>`;
  apresRendu(o);
}

function rendreVoyager(o = {}, avant){
  const h = TETE.voyager;
  const passe = Date.now() >= Date.UTC(2026, 10, 18);
  const retourCompo = avant && avant.type === 'compo' ? avant.id : null;
  survolNotice = null; survolCompoNotice = null;
  notice.innerHTML = `<article class="fiche" style="--acc:#e3c27e">
    <button class="retour" type="button" data-action="${retourCompo ? 'compo:' + retourCompo : 'accueil'}"><span aria-hidden="true">←</span> ${retourCompo ? PAR_ID[retourCompo].nom : 'Les six pages'}</button>
    <p class="lieux">5 septembre 1977 · Cap Canaveral</p>
    <h2 class="nom-complet" tabindex="-1">Voyager 1</h2>
    <p class="site-titre">Le disque d’or</p>
    <p class="fil-texte grand">${fr(h.txt)}</p>
    <p class="fil-texte grand">${fr(passe
      ? 'Depuis le 18 novembre 2026, la sonde est à plus d’un jour-lumière de la Terre. La page consacrée à Bach porte ce nom.'
      : 'Le 18 novembre 2026, la sonde sera pour la première fois à un jour-lumière de la Terre. La page consacrée à Bach porte ce nom.')}</p>
    <p class="paire" style="margin-top:1.2rem">${['bach', 'mozart', 'beethoven'].map(n => boutonVers(n, null)).join('<span class="sep" aria-hidden="true">·</span>')}</p>
    ${piedFil(h)}
  </article>`;
  apresRendu(o);
}

function apresRendu(o){
  if (o.depuis === 'notice' || o.depuis === 'clavier'){
    const h = notice.querySelector('h2'); if (h) h.focus({ preventScroll:true });
  }
  if (o.depuis === 'clavier') harpe.focus({ preventScroll:true });
  const comport = reduit ? 'auto' : 'smooth';
  const large = matchMedia('(min-width: 860px)').matches;
  const rn = notice.getBoundingClientRect();
  if (large){
    if (rn.top < 0) window.scrollTo({ top: window.scrollY + rn.top - 28, behavior: comport });
  } else if (o.depuis === 'notice'){
    const rh = harpe.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + rh.top - 6, behavior: comport });
  } else if (o.depuis === 'harpe'){
    const visible = innerHeight - rn.top;
    if (visible < 200) window.scrollTo({ top: window.scrollY + (rn.top - innerHeight + 280), behavior: comport });
  }
}

notice.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !notice.contains(b)) return;
  const act = b.dataset.action;
  if (act === 'accueil'){ sel = null; rendreAccueil(true); return; }
  if (act && act.startsWith('compo:')){ choisir('compo', act.slice(6), { depuis:'notice' }); return; }
  if (b.dataset.v){ choisir('voyager', 'voyager', { depuis:'notice' }); return; }
  if (b.dataset.c){ premiereInteraction(); choisir('compo', b.dataset.c, { depuis:'notice', via: b.dataset.via || null }); }
});
function allumerDepuis(el){
  const li = el && el.closest ? el.closest('.fil') : null;
  survolNotice = li ? new Set(li.dataset.fils.split(' ')) : null;
  notice.querySelectorAll('.fil.allume').forEach(x => { if (x !== li) x.classList.remove('allume'); });
  if (li) li.classList.add('allume');
  const ligne = el && el.closest ? el.closest('[data-table]') : null;
  survolCompoNotice = ligne ? ligne.dataset.c : null;
}
notice.addEventListener('pointerover', e => allumerDepuis(e.target));
notice.addEventListener('pointerleave', () => allumerDepuis(null));
notice.addEventListener('focusin', e => allumerDepuis(e.target));
notice.addEventListener('focusout', () => allumerDepuis(null));

function peindreMini(m, id){
  if (!m) return;
  const g = m.getContext('2d'), d = 2;
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, 56, 56);
  g.strokeStyle = 'rgba(205,171,104,.7)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(32, 3); g.lineTo(32, 53); g.stroke();
  const u = 8.4;
  if (id === 'bach') lune(g, 31.5, 28, u * 1.2, 99, true);
  else if (id === 'mozart') etourneau(g, 32, 29, u * 1.3, 99);
  else if (id === 'beethoven') cochlee(g, 27, 28, u * 1.6, 99);
  else if (id === 'chopin') fioritures(g, 33, 30, u * 1.25, 99);
  else if (id === 'liszt') comete(g, 32, 44, 53, u * .95, 99);
  else rastral(g, 32, 28, u * 1.3, 99);
}

/* =====================================================================
   Démarrage
   ===================================================================== */
(function grain(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const g = c.getContext('2d'), im = g.createImageData(160, 160);
    for (let i = 0; i < im.data.length; i += 4){
      const v = Math.random() * 255 | 0;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = Math.random() < .5 ? 0 : 20 + (Math.random() * 34 | 0);
    }
    g.putImageData(im, 0, 0);
    document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
  } catch (e) {}
})();

if (matchMedia('(hover: none)').matches) consigne.textContent = 'Touchez une corde. Glissez le doigt en travers pour un arpège.';
else consigneTete.textContent = 'Survolez les cordes pour les pincer. Cliquez pour suivre leurs fils.';

if (document.fonts && document.fonts.load){
  ['600 12px "Bodoni Moda"', 'italic 400 14px "Bodoni Moda"', '500 10px "Archivo"'].forEach(p => document.fonts.load(p).catch(() => {}));
  document.fonts.load('13px "Noto Music"', '\u{1D13D}').catch(() => {});
}

rendreAccueil(false);
mesurer();
lum.x = W * .5; lum.y = H * .4;
new ResizeObserver(() => mesurer()).observe(harpe);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ cancelAnimationFrame(rafId); rafId = 0; }
  else if (!rafId){ derniere = now(); rafId = requestAnimationFrame(boucle); }
});
rafId = requestAnimationFrame(boucle);

const ancre = (location.hash || '').slice(1).toLowerCase();
if (PAR_ID[ancre]) setTimeout(() => choisir('compo', ancre, { depuis:'ancre' }), reduit ? 0 : 1500);
})();
</script>
